name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bash coreutils
      - name: Make scripts executable
        run: |
          chmod +x runner.sh || true
          chmod +x experimental.sh || true
      - name: Run test suite
        run: |
          cd tests && bash run_all_tests.sh
