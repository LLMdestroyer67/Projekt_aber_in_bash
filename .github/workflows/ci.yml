name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n runner.sh experimental.sh modules/*.sh tests/*.sh
      - name: Run test suite
        run: bash tests/run_all_tests.sh
